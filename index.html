<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form | The Odin Project</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="banner">
        <img
          src="assets/sonder-quest-vTpr9AZD1QE-unsplash.jpg"
          alt="photo of an owl with amber eyes"
        />
        <h1>Odin Project</h1>
        <p>Photo by <span>Sonder Quest</span> on Unsplash</p>
      </div>
      <div class="main-content">
        <div class="main-text">
          <h1>Sign up to whatever</h1>
        </div>

        <form action="form-sent.html" method="get">
          <div class="form-content">
            <h2>Fill in the form with required information.</h2>
            <p>Required fields are marked with asterisk (*)</p>
            <div class="fields">
              <div class="field-column">
                <div class="form-field">
                  <label for="first-name">First Name *</label>
                  <input
                    type="text"
                    id="first-name"
                    name="first-name"
                    placeholder="Your first name"
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="email">Email *</label>
                  <input
                    type="email"
                    id="email"
                    name="user-email"
                    placeholder="example@example.com"
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="password"
                    >Password * (at least 8 characters long)</label
                  >
                  <input
                    required
                    type="password"
                    id="password"
                    name="user-password"
                    placeholder="Must have at least 8 characters"
                    minlength="8"
                  />
                </div>
              </div>
              <div class="field-column">
                <div class="form-field">
                  <label for="last-name">Last Name *</label>
                  <input
                    type="text"
                    id="last-name"
                    name="last-name"
                    placeholder="Your last name"
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="phone">Phone number *</label>
                  <input
                    type="tel"
                    inputmode="numeric"
                    id="phone"
                    name="phone"
                    required
                    placeholder="Your phone number"
                  />
                </div>
                <div class="form-field">
                  <label for="confirm-passwd">Confirm Password *</label>
                  <input
                    type="password"
                    id="confirm-passwd"
                    name="confirm-passwd"
                    placeholder="Type password again"
                    minlength="8"
                    required
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="form-interaction">
            <button type="submit">Create Account</button>

            <p>Aleready have an account? <span class="login">Log in</span></p>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
