<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form | The Odin Project</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="banner">
        <img
          src="assets/sonder-quest-vTpr9AZD1QE-unsplash.jpg"
          alt="photo of an owl with amber eyes"
        />
        <h1>Odin Project</h1>
        <p>Photo by <span>Sonder Quest</span> on Unsplash</p>
      </div>
      <div>
        <h1>Sign up to whatever</h1>
        <form action="/some-page" method="post">
          <div class="form-bg">
            <h2>Fill in the form with required information.</h2>
            <p>Required fields are marked with asterisk (*)</p>
            <div class="form-content">
              <div class="field-column">
                <div class="form-field">
                  <label for="first-name">First Name</label>
                  <input
                    type="text"
                    id="first-name"
                    name="first-name"
                    placeholder="Your first name"
                  />
                </div>
              </div>
              <div class="field-column"></div>
            </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
